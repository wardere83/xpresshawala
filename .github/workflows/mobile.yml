name: Mobile builds

# Note: this workflow has a paths filter, so an empty commit will not
# trigger it. Use the Actions tab's "Run workflow" button to re-run by hand.

# Builds the apps on GitHub's runners, which already carry the Android SDK and
# Xcode. Nothing has to be installed locally, and every run leaves a downloadable
# artifact under the run's summary page.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'public/**'
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'api/**'
      - 'tests/**'
      - 'playwright.config.ts'
      - '.github/workflows/mobile.yml'
      # The signing steps run these, so a fix to one has to trigger a build.
      - 'scripts/ci/**'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Release quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run lint
      - run: npm run typecheck --prefix api
      - run: npm test --prefix api
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - run: npm run test:e2e
      - name: Keep failed release browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-browser-failure-diagnostics
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  android-check:
    name: Android release compile and lint
    needs: quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run build:mobile
        env:
          VITE_API_URL: https://xpresstend.com/api
      - run: ./gradlew --no-daemon assembleRelease bundleRelease lintRelease testReleaseUnitTest
        working-directory: android

  android:
    name: Android signed APK and Play App Bundle
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Build and sync the production app
        run: npm run build:mobile
        env:
          VITE_API_URL: https://xpresstend.com/api
      - name: Assemble signed release APK and App Bundle
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          ANDROID_REQUIRE_SIGNING: 'true'
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Android release signing credentials are required. No debug fallback can be published."
            exit 1
          fi
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          ../scripts/ci/decode-base64-secret.sh ANDROID_KEYSTORE "$ANDROID_KEYSTORE_PATH" "Android upload keystore"
          ./gradlew --no-daemon assembleRelease bundleRelease lintRelease testReleaseUnitTest
        working-directory: android
      - name: Verify APK and App Bundle release signatures and metadata
        run: scripts/ci/verify-android-release.sh
        env:
          EXPECTED_ANDROID_VERSION_CODE: ${{ github.run_number }}
      - name: Upload verified Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xpresstend-android-release
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error
      - name: Prepare public Android download
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/xpresstend.apk
          (cd release && sha256sum xpresstend.apk > SHA256SUMS)
      - name: Publish the verified rolling download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: XpressTend for Android
          body: |
            Signed release APK built from main. Transfers remain in test mode; no customer funds are charged or delivered.

            Download xpresstend.apk to install directly. The separately signed Google Play App Bundle is available in this run's xpresstend-android-release artifact.
          files: |
            release/xpresstend.apk
            release/SHA256SUMS
          make_latest: true

  ios:
    name: iOS (compile check)
    needs: quality
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the current Xcode toolchain
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the web app and sync it into the native project
        run: npm run build:mobile
        env:
          VITE_API_URL: https://xpresstend.com/api

      # Capacitor 8 resolves its native dependencies through Swift Package
      # Manager, so there is no Podfile and no workspace: the project builds
      # directly. Unsigned, because a distributable build needs an Apple
      # Developer account and certificates.
      - name: Compile without signing
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme XpressTend \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ios/App

      - name: Upload the simulator build
        uses: actions/upload-artifact@v4
        with:
          name: xpresstend-ios-simulator
          path: ios/App/build/Build/Products/Debug-iphonesimulator/XpressTend.app
          retention-days: 30
          if-no-files-found: error

      - name: Launch the app on an iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          DEVICE=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1]))['devices']
          phones = [(runtime, device['udid']) for runtime, entries in devices.items()
                    if 'iOS' in runtime for device in entries
                    if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not phones: raise SystemExit('No iPhone simulator is available')
          print(sorted(phones, reverse=True)[0][1])
          PY
          )
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/App/build/Build/Products/Debug-iphonesimulator/XpressTend.app
          xcrun simctl launch "$DEVICE" com.xpresstend.app
          # Let the native splash and first API session check finish.
          sleep 12
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/ios-launch.png"
          xcrun simctl shutdown "$DEVICE"
      - name: Keep the native launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: xpresstend-ios-launch
          path: ${{ runner.temp }}/ios-launch.png
          if-no-files-found: error

  ios-signed:
    name: iOS signed build
    needs: quality
    # App Store Connect rejects anything built with an SDK older than iOS 26:
    #   "This app was built with the iOS 18.5 SDK. All iOS and iPadOS apps must
    #    be built with the iOS 26 SDK or later"
    # macos-15 tops out at Xcode 16, so the whole build ran and then failed at
    # the very last step. The image has to carry Xcode 26.
    runs-on: macos-26
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Job level, not step level: a step's `if` is evaluated before its own env
    # block exists, so guarding on a step-scoped secret silently skips the step
    # and the job still passes.
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirm signing is configured
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE_P12" ] || [ -z "$APPLE_PROVISIONING_PROFILE" ]; then
            echo "::error::Signing secrets are missing, so no IPA can be produced."
            echo "Set APPLE_CERTIFICATE_P12, APPLE_CERTIFICATE_PASSWORD and APPLE_PROVISIONING_PROFILE."
            exit 1
          fi
          if [ -n "$APPSTORE_PRIVATE_KEY" ] && { [ -z "$APPSTORE_KEY_ID" ] || [ -z "$APPSTORE_ISSUER_ID" ]; }; then
            echo "::error::TestFlight upload requires the API key ID and issuer ID."
            exit 1
          fi
          echo "Signing prerequisites present."

      - name: Select the newest Xcode and require an iOS 26 SDK
        run: |
          set -euo pipefail
          # Pick the highest Xcode on the image rather than trusting the default,
          # which is not always the newest installed.
          NEWEST=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then
            echo "Selecting $NEWEST"
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          fi
          xcodebuild -version
          SDK=$(xcodebuild -showsdks | grep -oE 'iphoneos[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "Highest iOS SDK: $SDK"
          # Fail here, in seconds, rather than after a full archive: App Store
          # Connect rejects an older SDK at upload, which is the last step of a
          # fifteen-minute job.
          if [ -z "$SDK" ] || [ "$SDK" -lt 26 ]; then
            echo "::error::iOS SDK $SDK is too old. App Store Connect requires 26 or later, so this build could not be uploaded."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build the web app and sync it into the native project
        run: npm run build:mobile
        env:
          VITE_API_URL: https://xpresstend.com/api

      # Split deliberately: runner logs are not readable from here, so each
      # command gets its own step and the failing step name identifies it.
      - name: Create a throwaway keychain
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          echo "KEYCHAIN=$RUNNER_TEMP/signing.keychain-db" >> "$GITHUB_ENV"
          KEYCHAIN_PW=$(uuidgen)
          echo "::add-mask::$KEYCHAIN_PW"
          echo "KEYCHAIN_PW=$KEYCHAIN_PW" >> "$GITHUB_ENV"

      - name: Initialise the keychain and search list
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Joining the search list is what lets trust be evaluated against it;
          # without it an imported identity reads as invalid.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/[":]//g' | xargs)
          security list-keychains -d user

      - name: Install the Apple WWDR intermediate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          # Already-present is not an error worth failing the build over.
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true

      # The decode runs through a shared helper rather than inline: base64(1)
      # fails the same way for half a dozen different formatting mistakes, and
      # inline under `set -e` the step died before its own diagnostics could
      # name which one. The helper tolerates the recoverable ones and reports
      # the rest without printing the secret.
      - name: Decode the certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          scripts/ci/decode-base64-secret.sh \
            APPLE_CERTIFICATE_P12 "$RUNNER_TEMP/cert.p12" "distribution certificate" --expect-der

      - name: Check the certificate password
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          # OpenSSL 3, which ships on the newer runner image, refuses the older
          # RC2 encryption Apple's export still produces unless -legacy is
          # given. The same file opened cleanly under OpenSSL 1.1 on macos-15,
          # so try the modern reader first and fall back rather than assuming
          # either. Only if both fail is the password actually wrong.
          if openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nokeys -noout 2>/dev/null; then
            echo "Password accepted."
          elif openssl pkcs12 -legacy -in "$RUNNER_TEMP/cert.p12" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nokeys -noout 2>/dev/null; then
            echo "Password accepted (legacy ciphers)."
          else
            echo "::error::The .p12 decoded correctly but APPLE_CERTIFICATE_PASSWORD does not open it, with or without -legacy."
            openssl version
            exit 1
          fi

      - name: Import the distribution certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        # No -x here: tracing would put the password in the log.
        run: |
          set -euo pipefail
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Allow codesign to use the key without prompting
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          # A known CI trip hazard, so it gets its own step. Without it codesign
          # blocks on a UI prompt nothing on a runner can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null 2>&1 || \
            echo "::warning::set-key-partition-list failed; continuing since -A was used on import"

      - name: Install the provisioning profile
        if: env.APPLE_CERTIFICATE_P12 != ''
        # No -x: tracing would expand the profile into the log.
        run: |
          set -euo pipefail
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          scripts/ci/decode-base64-secret.sh \
            APPLE_PROVISIONING_PROFILE "$DIR/XpressTend.mobileprovision" "provisioning profile"
          ls -l "$DIR"

      - name: Verify a usable signing identity
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          security find-identity -v -p codesigning "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"

      - name: Archive and export the IPA
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          # The project still carries Capacitor's default CODE_SIGN_IDENTITY of
          # "iPhone Developer", so an archive asks for a development certificate
          # and fails against a distribution one:
          #   No "iOS Development" signing certificate matching team ID ... was found
          # Setting the identity on the command line overrides that for every
          # target, which is what the runner's keychain actually holds.
          xcodebuild -project App.xcodeproj -scheme XpressTend \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/XpressTend.xcarchive" \
            DEVELOPMENT_TEAM=64H8428M8D \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="XpressTend App Store" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/XpressTend.xcarchive" \
            -exportOptionsPlist ../ci/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"
        working-directory: ios/App

      - name: Inspect the exported store app
        run: python3 scripts/ci/verify-ios-release.py "$RUNNER_TEMP/export/XpressTend.ipa" "${{ github.run_number }}"

      - name: Upload the IPA
        if: env.APPLE_CERTIFICATE_P12 != ''
        uses: actions/upload-artifact@v4
        with:
          name: xpresstend-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload to TestFlight
        if: env.APPSTORE_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          # altool reads the key from this fixed location, named for the key id.
          mkdir -p ~/.appstoreconnect/private_keys
          scripts/ci/decode-base64-secret.sh APPSTORE_PRIVATE_KEY \
            ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8 \
            "App Store Connect key"

          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          echo "Uploading $(basename "$IPA")"

          # Validate first: a rejected binary fails here with a readable reason
          # rather than as a silent processing failure in App Store Connect.
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"

          node scripts/ci/inspect-app-store-build.mjs "$KEY_PATH" "${{ github.run_number }}"

          rm -f ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8
          echo "Uploaded. Processing in App Store Connect usually takes 10 to 15 minutes."

      - name: Say why TestFlight was skipped
        if: env.APPSTORE_PRIVATE_KEY == ''
        run: |
          echo "::notice::IPA built but not uploaded: App Store Connect API key secrets are not set."

      - name: Remove temporary signing material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/wwdr.cer"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/XpressTend.mobileprovision"
          if [ -n "${APPSTORE_KEY_ID:-}" ]; then
            rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"
          fi
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
