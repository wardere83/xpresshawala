name: Build & deploy

# The site and API are one Cloudflare Worker. GitHub Pages and the HostGator
# FTPS target are both retired: a Worker route intercepts every request to
# xpresstend.com ahead of any origin, which is what allows the security headers
# that a static host could not set.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix api

      - name: Lint
        run: npm run lint

      - name: Type-check the Worker
        run: npx tsc --noEmit
        working-directory: api

      - name: Money and ledger tests
        run: npm test
        working-directory: api

      - name: Build the site
        run: npm run build

      # Chrome, not Chromium: the bundled Chromium has no proprietary codecs,
      # so the H.264 product film cannot play and the playback checks fail on a
      # film that works everywhere it actually ships.
      - name: Install browser for product checks
        run: npx playwright install --with-deps chrome

      - name: Website and app journey checks
        run: npm run test:e2e

      - name: Keep the built site as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14

  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: sanctions-production
      cancel-in-progress: false
    # Job level, not step level. A step's `if` is evaluated before that step's
    # own env block exists, so a guard on a step-scoped secret compares against
    # an empty string and the step is skipped every time — which is how the
    # deploy silently published nothing while reporting success. The same fault
    # was fixed in the iOS signing job in cc384ea.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm ci --prefix api
      - run: npm run build

      - name: Prepare the official sanctions-data tables
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute xpresstend-production --remote --file=migrations/0007_ofac_sanctions.sql --yes
        working-directory: api

      - name: Prepare customer recovery and account deletion
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 execute xpresstend-production --remote --file=migrations/0008_customer_lifecycle.sql --yes
        working-directory: api

      - name: Refresh and validate official Treasury sanctions data
        id: sanctions-data
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: node --experimental-strip-types scripts/refresh-sanctions.mjs --remote
        working-directory: api

      # Absence is still not a failure — a fork or an unconfigured checkout
      # should build and test without trying to publish — but it says so,
      # rather than leaving a green tick to mean a deploy that never happened.
      - name: Deploy the Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        working-directory: api

      - name: Check customer recovery email configuration
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > "$RUNNER_TEMP/worker-secret-names.json"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const names = new Set(JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/worker-secret-names.json`, 'utf8')).map(entry => entry.name));
          const microsoft = ['MS_TENANT_ID', 'MS_CLIENT_ID', 'MS_CLIENT_SECRET'].every(name => names.has(name));
          const resend = names.has('RESEND_API_KEY');
          console.log(JSON.stringify({ customerRecoveryEmailConfigured: microsoft || resend, provider: microsoft ? 'microsoft-graph' : resend ? 'resend' : null }));
          if (!microsoft && !resend) console.log('::warning::Customer password recovery needs a configured transactional email provider before public app release.');
          JS
        working-directory: api

      - name: Verify the deployed official sanctions dataset
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          OFAC_EXPECTED_VERSION: ${{ steps.sanctions-data.outputs.version }}
        run: |
          node --input-type=module <<'JS'
          if (!process.env.OFAC_EXPECTED_VERSION) throw new Error('No validated import version was recorded.');
          let status;
          for (let attempt = 0; attempt < 6; attempt++) {
            try {
              const response = await fetch('https://xpresstend.com/api/compliance/sanctions-status', {
                headers: { 'cache-control': 'no-cache' },
                signal: AbortSignal.timeout(10_000),
              });
              const result = response.ok ? await response.json() : null;
              if (result?.ready && result.provider === 'us-treasury-ofac' &&
                  result.version === process.env.OFAC_EXPECTED_VERSION) {
                status = result;
                break;
              }
            } catch {
              // Allow the new Worker a short propagation window.
            }
            if (attempt < 5) await new Promise(resolve => setTimeout(resolve, 5_000));
          }
          if (!status) throw new Error('The deployed sanctions dataset is not the validated imported version.');
          console.log(JSON.stringify({ provider: status.provider, ready: status.ready,
            version: status.version, entityCount: status.entityCount, nameCount: status.nameCount,
            checkedAt: status.checkedAt }));
          JS

      - name: Say why nothing was published
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN is not set, so the Worker was not deployed and the live site is unchanged."
