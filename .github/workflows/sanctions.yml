name: Refresh official OFAC sanctions data

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deploy initialization uses this same group. An unfinished import cannot
    # race another import, activation or retained-snapshot cleanup.
    concurrency:
      group: sanctions-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci
        working-directory: api

      - name: Require the configured production credential
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::The production OFAC refresh requires the existing Cloudflare deployment credential."
            exit 1
          fi

      - name: Initialize the official-source tables
        run: npx wrangler d1 execute xpresstend-production --remote --file=migrations/0007_ofac_sanctions.sql --yes
        working-directory: api

      - name: Validate and atomically activate official OFAC data
        id: sanctions-data
        run: node --experimental-strip-types scripts/refresh-sanctions.mjs --remote
        working-directory: api
