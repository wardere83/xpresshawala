apply plugin: 'com.android.application'

def releaseStorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("ANDROID_KEY_ALIAS") ?: "upload"
def releaseKeyPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: releaseStorePassword
def releaseStoreType = System.getenv("ANDROID_KEYSTORE_TYPE") ?: "PKCS12"
def requireReleaseSigning = System.getenv("ANDROID_REQUIRE_SIGNING") == "true"
if (requireReleaseSigning && !releaseStorePath) {
    throw new GradleException("A distribution build requires ANDROID_KEYSTORE_PATH and signing credentials; an unsigned build cannot be published.")
}
if (releaseStorePath && (!file(releaseStorePath).isFile() || !releaseStorePassword || !releaseKeyPassword)) {
    throw new GradleException("The configured Android signing file or passwords are missing.")
}
def buildVersionCode = System.getenv("ANDROID_VERSION_CODE") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "1"
if (!(buildVersionCode ==~ /[1-9][0-9]*/) || new BigInteger(buildVersionCode) > 2100000000) {
    throw new GradleException("ANDROID_VERSION_CODE must be an integer between 1 and 2100000000.")
}
def buildVersionName = System.getenv("ANDROID_VERSION_NAME") ?: "1.0"

android {
    // Release signing comes from the environment, so no key material sits in
    // the repository. Without it the release build is unsigned and the workflow
    // refuses to publish, rather than falling back to the debug key.
    signingConfigs {
        release {
            if (releaseStorePath) {
                storeFile file(releaseStorePath)
                storeType releaseStoreType
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    namespace = "com.xpresstend.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.xpresstend.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildVersionCode.toInteger()
        versionName buildVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            signingConfig releaseStorePath ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
